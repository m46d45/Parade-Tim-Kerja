 produksi:"Manufaktur: pekerja diam, produk berjalan. Konstruksi: pekerja berjalan, produk diam.",

 waste:"Waste = lihat orangnya. BEK sudah masuk site, TUL masih kerja. COR tetap di luar."
};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));

  document.getElementById("s").textContent=sub[b.dataset.id];
});
